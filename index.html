<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大老二">
<meta name="theme-color" content="#c0392b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>大老二計分器</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e4e1da;
    --accent:#c0392b; --accent-ink:#fff; --win:#1f8a4c; --lose:#c0392b; --soft:#f0ede6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141416; --card:#1e1e21; --ink:#f2f2f2; --sub:#9a9aa0; --line:#2e2e33;
      --accent:#e0533f; --win:#3ec47a; --lose:#ff6b5b; --soft:#26262a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-tap-highlight-color:transparent}
  main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px}
  .ghost{background:var(--soft);color:var(--ink);padding:8px 12px;font-size:14px}
  .ghost.danger{color:var(--lose)}
  .primary{background:var(--accent);color:var(--accent-ink);width:100%;padding:14px;font-size:17px;font-weight:700}
  .primary:disabled{opacity:.4;cursor:not-allowed}
  input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  textarea{font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--soft);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;width:100%;margin-top:8px;resize:vertical;word-break:break-all}
  .ok{color:var(--win)!important}
  .sync{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--sub);
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:-4px 0 14px}
  .sync.warn{color:var(--lose);border-color:var(--lose)}
  .sync.good{color:var(--win)}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}

  /* totals */
  .totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tot{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center;position:relative}
  .tot .nm{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tot .pt{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .tot .mn{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
  .tot.lead{outline:2px solid var(--win)}
  .tot.lead::after{content:"👑";position:absolute;top:-10px;right:-4px;font-size:16px}
  .pos{color:var(--win)} .neg{color:var(--lose)} .zero{color:var(--sub)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}

  /* entry */
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .pname{font-size:16px;font-weight:600}
  .wbtn{background:var(--soft);color:var(--sub);padding:6px 10px;font-size:13px;margin-left:8px}
  .row.winner .wbtn{background:var(--win);color:#fff}
  .row.winner .pname::after{content:" 贏家";font-size:12px;color:var(--win);font-weight:700}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;background:var(--soft);color:var(--ink);font-size:20px;font-weight:700}
  .step input{width:64px;text-align:center;font-size:18px;font-weight:700;padding:6px 4px}
  .winnote{font-size:14px;color:var(--win);font-weight:700;padding:0 6px;min-width:142px;text-align:right}
  .hint{font-size:13px;color:var(--sub);margin:4px 0 12px}
  .err{font-size:13px;color:var(--lose);min-height:18px;margin:8px 0 6px}
  .editbar{display:none;justify-content:space-between;align-items:center;background:var(--soft);
    border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
  .editing .editbar{display:flex}

  /* history */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
  td.r{color:var(--sub);font-size:12px}
  td.w{font-weight:800}
  tr.sel td{background:var(--soft)}
  .act button{background:none;color:var(--sub);padding:4px 6px;font-size:13px}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:14px 0}

  /* settings */
  details summary{cursor:pointer;font-size:15px;color:var(--sub);font-weight:600;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main>
  <header>
    <h1>♠ 大老二<span>計分器</span></h1>
    <button class="ghost" id="copyBtn">複製戰績</button>
  </header>
  <div class="sync" id="syncStatus" style="display:none"></div>

  <!-- 總分 -->
  <section class="card">
    <h2>目前總計</h2>
    <div class="totals" id="totals"></div>
    <div class="meta"><span id="roundCount">尚未開始</span><span id="priceNote"></span></div>
  </section>

  <!-- 輸入 -->
  <section class="card" id="entryCard">
    <div class="editbar"><span id="editLabel">正在修改</span><button class="ghost" id="cancelEdit">取消</button></div>
    <h2 id="entryTitle">第 1 局</h2>
    <p class="hint">先點選贏家，再輸入其他三家要扣的張數（加倍請自行算好再填）。</p>
    <div id="entry"></div>
    <div class="err" id="err"></div>
    <button class="primary" id="submit" disabled>記錄這局</button>
  </section>

  <!-- 歷史 -->
  <section class="card">
    <h2>每局明細（張數）</h2>
    <div id="history"></div>
  </section>

  <!-- 匯出匯入 -->
  <section class="card">
    <details id="transfer">
      <summary>匯出／匯入戰績（換手機、換人記錄）</summary>
      <p class="hint" style="margin-top:12px">匯出：複製下面這串戰績碼，用 LINE 傳給接手的人（或傳給自己）。<br>匯入：在新的瀏覽器打開這個網頁，把戰績碼貼進來就能接著記。</p>
      <div class="btns" style="margin-top:4px">
        <button class="ghost" id="exportBtn">匯出並複製戰績碼</button>
      </div>
      <textarea id="exportBox" readonly rows="3" style="display:none" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <label for="importBox" style="margin-top:14px">貼上戰績碼匯入</label>
      <textarea id="importBox" rows="3" placeholder="BIG2-…" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>
      <div class="err" id="importMsg"></div>
      <button class="ghost" id="importBtn">匯入</button>
    </details>
  </section>

  <!-- 設定 -->
  <section class="card">
    <details id="settings">
      <summary>玩家名稱與金額設定</summary>
      <div class="grid2" id="nameInputs"></div>
      <div style="margin-top:10px">
        <label for="price">每張金額（元，0 表示不換算）</label>
        <input id="price" type="number" inputmode="decimal" min="0" step="1">
      </div>
      <div class="btns">
        <button class="ghost danger" id="resetBtn">開新牌局（清空所有局數）</button>
      </div>
    </details>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY = "big2-scorer-v1";
let state = { players:["玩家 A","玩家 B","玩家 C","玩家 D"], price:10, rounds:[] };
let draft = { winner:null, cards:[0,0,0,0] };
let editIndex = null;      // 正在修改第幾局（index）
let pendingConfirm = null; // 二次確認用

try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.rounds)) state = Object.assign(state, s); } catch(e){}
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function save(){ state.updatedAt = Date.now(); saveLocal(); pushCloud(); }

// —— 雲端儲存（存在使用者自己的 claude.ai 帳號，只有本人看得到）——
const cloud = { ref:null, tried:false, status:"init", writing:false, dirty:false, retry:null };
const STATUS = {
  init:  ["", "⏳", "檢查雲端儲存中…"],
  ok:    ["good", "☁️", "已自動存到你的 claude.ai 帳號，關掉、換裝置都不會遺失"],
  saving:["good", "☁️", "儲存中…"],
  err:   ["warn", "⚠️", "雲端暫時連不上，先存在這個瀏覽器，連上後會自動補存"],
  local: ["warn", "⚠️", "目前只存在這個瀏覽器，關掉可能會遺失。請在這個頁面登入 claude.ai，或用下方戰績碼備份"]
};
function setStatus(s){
  cloud.status = s; const [c, icon, text] = STATUS[s], el = $("syncStatus");
  el.className = "sync " + c; el.innerHTML = `<span>${icon}</span><span>${text}</span>`;
}
function pushCloud(){
  if (!cloud.ref) return;
  cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(flush, 400);
}
async function flush(){
  if (!cloud.ref || cloud.writing || !cloud.dirty) return;
  cloud.writing = true; cloud.dirty = false; setStatus("saving");
  try {
    await cloud.ref.set({ code: encodeState(), updatedAt: state.updatedAt || 0 });
    setStatus("ok");
  } catch(e){
    const code = e && e.code;
    if (["invalid_argument","not_granted","revoked","capability_disabled","capability_removed"].includes(code)){
      cloud.ref = null; setStatus("local");
    } else {
      cloud.dirty = true; setStatus("err");
      clearTimeout(cloud.retry); cloud.retry = setTimeout(()=>{ cloud.retry=null; flush(); }, 4000 + Math.random()*2000);
    }
  } finally {
    cloud.writing = false;
    if (cloud.dirty && cloud.ref && !cloud.retry) flush();
  }
}
function adopt(remote){
  state = Object.assign({ players:state.players, price:state.price, rounds:[] }, remote);
  saveLocal(); pendingConfirm = null;
  if (editIndex !== null && editIndex >= state.rounds.length) resetDraft();
  if (!document.activeElement || !document.activeElement.dataset || document.activeElement.dataset.name === undefined && document.activeElement.id !== "price") renderSettings();
  renderAll();
}
async function initCloud(){
  const timeout = setTimeout(()=>{ if (cloud.status === "init") setStatus(cloud.tried ? "err" : "local"); }, 10000);
  try {
    if (!window.claude || typeof window.claude.use !== "function"){ clearTimeout(timeout); setStatus("local"); return; }
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!user || !db){ clearTimeout(timeout); setStatus("local"); return; }
    const id = await user.id();
    if (!id){ clearTimeout(timeout); setStatus("local"); return; }
    cloud.tried = true;
    const ref = db.doc("data/users/" + id + "/big2");
    let confirmed = false;
    ref.onSnapshot(snap=>{
      if (snap.metadata.fromCache && !confirmed) return;           // 等雲端正式回應
      let remote = null;
      if (snap.exists){ try { remote = decodeState(snap.data().code || ""); } catch(e){} }
      if (!confirmed){
        confirmed = true; clearTimeout(timeout); cloud.ref = ref;
        if (remote && (remote.updatedAt||0) >= (state.updatedAt||0)) { adopt(remote); setStatus("ok"); }
        else if (state.rounds.length || state.updatedAt) { cloud.dirty = true; flush(); }
        else setStatus("ok");
        return;
      }
      // 其他裝置更新了 → 同步過來
      if (remote && !snap.metadata.hasPendingWrites && (remote.updatedAt||0) > (state.updatedAt||0)) adopt(remote);
    }, ()=>{ clearTimeout(timeout); cloud.ref = null; setStatus("local"); });
  } catch(e){ clearTimeout(timeout); setStatus("local"); }
}

const $ = id => document.getElementById(id);
const fmt = n => (n > 0 ? "+" : "") + n;
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "zero";
const money = n => {
  const v = Math.round(n * state.price * 100) / 100;
  return (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString();
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 一局的輸贏：輸家扣剩餘張數，贏家拿三家總和
function deltas(r){
  const d = [0,0,0,0]; let sum = 0;
  for (let i=0;i<4;i++) if (i !== r.winner){ d[i] = -r.cards[i]; sum += r.cards[i]; }
  d[r.winner] = sum; return d;
}
function totals(){
  const t = [0,0,0,0];
  state.rounds.forEach(r => deltas(r).forEach((v,i)=> t[i]+=v));
  return t;
}

function renderTotals(){
  const t = totals(), max = Math.max(...t), has = state.rounds.length > 0;
  $("totals").innerHTML = t.map((v,i)=>`
    <div class="tot ${has && v===max && max>0 ? "lead":""}">
      <div class="nm">${esc(state.players[i])}</div>
      <div class="pt ${cls(v)}">${fmt(v)}</div>
      ${state.price>0 ? `<div class="mn ${cls(v)}">${money(v)}</div>` : ""}
    </div>`).join("");
  $("roundCount").textContent = has ? `已打 ${state.rounds.length} 局` : "尚未開始";
  $("priceNote").textContent = state.price>0 ? `每張 $${state.price}` : "不換算金額";
}

function renderEntry(){
  const w = draft.winner;
  let sum = 0;
  for (let i=0;i<4;i++) if (i!==w) sum += draft.cards[i]||0;
  $("entry").innerHTML = state.players.map((p,i)=>{
    const isW = i===w;
    return `<div class="row ${isW?"winner":""}">
      <div><span class="pname">${esc(p)}</span><button class="wbtn" data-win="${i}">${isW?"✓ 贏":"設為贏家"}</button></div>
      ${isW
        ? `<div class="winnote">+${sum} 張</div>`
        : `<div class="step">
             <button data-dec="${i}" aria-label="減一">−</button>
             <input type="number" inputmode="numeric" min="1" data-in="${i}" value="${draft.cards[i]||""}" placeholder="—">
             <button data-inc="${i}" aria-label="加一">＋</button>
           </div>`}
    </div>`;
  }).join("");
  validate();
}

function validate(){
  let msg = "";
  if (draft.winner===null) msg = "";
  else {
    for (let i=0;i<4;i++){
      if (i===draft.winner) continue;
      const n = draft.cards[i];
      if (!n) { msg = ""; $("submit").disabled = true; $("err").textContent = ""; return; }
      if (n<1 || !Number.isInteger(n)) msg = `${state.players[i]} 的張數需為正整數`;
    }
  }
  $("err").textContent = msg;
  $("submit").disabled = draft.winner===null || !!msg;
}

function renderHistory(){
  if (!state.rounds.length){ $("history").innerHTML = `<div class="empty">還沒有紀錄</div>`; return; }
  const head = `<tr><th>局</th>${state.players.map(p=>`<th>${esc(p)}</th>`).join("")}<th></th></tr>`;
  const rows = state.rounds.map((r,k)=>({r,k})).reverse().map(({r,k})=>{
    const d = deltas(r);
    const isPend = pendingConfirm && pendingConfirm.type==="del" && pendingConfirm.k===k;
    return `<tr class="${editIndex===k?"sel":""}"><td class="r">${k+1}</td>
      ${d.map((v,i)=>`<td class="${cls(v)} ${i===r.winner?"w":""}">${fmt(v)}</td>`).join("")}
      <td class="act"><button data-edit="${k}">改</button><button data-del="${k}" style="${isPend?"color:var(--lose);font-weight:700":""}">${isPend?"確定刪?":"刪"}</button></td></tr>`;
  }).join("");
  $("history").innerHTML = `<table>${head}${rows}</table>`;
}

function renderSettings(){
  $("nameInputs").innerHTML = state.players.map((p,i)=>`
    <div><label>玩家 ${i+1}</label><input data-name="${i}" value="${esc(p)}" maxlength="10"></div>`).join("");
  $("price").value = state.price;
}

function renderEntryHeader(){
  const card = $("entryCard");
  if (editIndex!==null){
    card.classList.add("editing");
    $("editLabel").textContent = `正在修改第 ${editIndex+1} 局`;
    $("entryTitle").textContent = `修改第 ${editIndex+1} 局`;
    $("submit").textContent = "更新這局";
  } else {
    card.classList.remove("editing");
    $("entryTitle").textContent = `第 ${state.rounds.length+1} 局`;
    $("submit").textContent = "記錄這局";
  }
}

function renderAll(){ renderTotals(); renderEntryHeader(); renderEntry(); renderHistory(); }

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1600); }
function resetDraft(){ draft = { winner:null, cards:[0,0,0,0] }; editIndex = null; }

// —— 事件 ——
$("entry").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if (b.dataset.win!==undefined){ draft.winner = +b.dataset.win; draft.cards[draft.winner]=0; renderEntry(); return; }
  if (b.dataset.inc!==undefined){ const i=+b.dataset.inc; draft.cards[i]=(draft.cards[i]||0)+1; renderEntry(); return; }
  if (b.dataset.dec!==undefined){ const i=+b.dataset.dec; draft.cards[i]=Math.max(1,(draft.cards[i]||1)-1); renderEntry(); return; }
});
$("entry").addEventListener("input", e=>{
  const i = e.target.dataset.in; if(i===undefined) return;
  const v = e.target.value.trim();
  draft.cards[+i] = v==="" ? 0 : Number(v);
  // 只更新贏家合計與驗證，避免輸入框失焦
  let sum=0; for(let k=0;k<4;k++) if(k!==draft.winner) sum+=draft.cards[k]||0;
  const wn = document.querySelector(".winnote"); if(wn) wn.textContent = `+${sum} 張`;
  validate();
});
$("entry").addEventListener("change", ()=>renderEntry());

$("submit").addEventListener("click", ()=>{
  if ($("submit").disabled) return;
  const r = { winner:draft.winner, cards:draft.cards.map((n,i)=> i===draft.winner?0:n) };
  if (editIndex!==null){ state.rounds[editIndex]=r; toast(`第 ${editIndex+1} 局已更新`); }
  else { state.rounds.push(r); toast(`第 ${state.rounds.length} 局已記錄`); }
  save(); resetDraft(); pendingConfirm=null; renderAll();
});
$("cancelEdit").addEventListener("click", ()=>{ resetDraft(); renderAll(); });

$("history").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if (b.dataset.edit!==undefined){
    const k=+b.dataset.edit, r=state.rounds[k];
    editIndex=k; draft={winner:r.winner, cards:[...r.cards]}; pendingConfirm=null;
    renderAll(); $("entryCard").scrollIntoView({behavior:"smooth",block:"start"}); return;
  }
  if (b.dataset.del!==undefined){
    const k=+b.dataset.del;
    if (pendingConfirm && pendingConfirm.type==="del" && pendingConfirm.k===k){
      state.rounds.splice(k,1); pendingConfirm=null;
      if (editIndex!==null) resetDraft();
      save(); renderAll(); toast("已刪除");
    } else { pendingConfirm={type:"del",k}; renderHistory(); setTimeout(()=>{ if(pendingConfirm&&pendingConfirm.k===k){pendingConfirm=null;renderHistory();} },3000); }
  }
});

$("nameInputs").addEventListener("input", e=>{
  const i=e.target.dataset.name; if(i===undefined) return;
  state.players[+i] = e.target.value.trim() || `玩家 ${+i+1}`;
  save(); renderTotals(); renderEntry(); renderHistory();
});
$("price").addEventListener("input", e=>{
  const v = Number(e.target.value); state.price = isFinite(v)&&v>=0 ? v : 0;
  save(); renderTotals();
});
$("resetBtn").addEventListener("click", e=>{
  const b=e.currentTarget;
  if (pendingConfirm && pendingConfirm.type==="reset"){
    state.rounds=[]; pendingConfirm=null; resetDraft(); save(); renderAll();
    b.textContent="開新牌局（清空所有局數）"; toast("已開新牌局（名稱與金額保留）");
  } else {
    pendingConfirm={type:"reset"}; b.textContent="再按一次確認清空";
    setTimeout(()=>{ if(pendingConfirm&&pendingConfirm.type==="reset"){pendingConfirm=null;b.textContent="開新牌局（清空所有局數）";} },3000);
  }
});

$("copyBtn").addEventListener("click", async ()=>{
  const t = totals();
  const order = [0,1,2,3].sort((a,b)=>t[b]-t[a]);
  const lines = [`大老二戰績（共 ${state.rounds.length} 局${state.price>0?`，每張 $${state.price}`:""}）`];
  order.forEach((i,rank)=> lines.push(`${rank+1}. ${state.players[i]}：${fmt(t[i])} 張${state.price>0?`（${money(t[i])}）`:""}`));
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); toast("已複製，可直接貼到 LINE"); }
  catch(e){ toast("無法複製，請手動截圖"); }
});

// —— 匯出／匯入 ——
// 戰績碼用 Base32（只有大寫英文＋數字 2–7），大小寫被改掉也能正確讀取
const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function b32enc(bytes){
  let out="", bits=0, val=0;
  for (const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } }
  if (bits>0) out+=B32[(val<<(5-bits))&31];
  return out;
}
function b32dec(str){
  const out=[]; let bits=0, val=0;
  for (const ch of str.toUpperCase()){
    const k=B32.indexOf(ch); if(k<0) throw new Error("戰績碼含有無效字元，請確認完整複製");
    val=((val<<5)|k)&0xffff; bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; }
  }
  return Uint8Array.from(out);
}
function encodeState(){
  const data = { v:1, p:state.players, $:state.price, t:state.updatedAt||0, r:state.rounds.map(r=>[r.winner, ...r.cards]) };
  return "BIG2-" + b32enc(new TextEncoder().encode(JSON.stringify(data)));
}
function decodeState(code){
  code = code.replace(/\s+/g, "");
  let bytes, m;
  if ((m = code.match(/big2-([a-z2-7]+)/i))) bytes = b32dec(m[1]);          // 新格式，不分大小寫
  else if ((m = code.match(/big2:([A-Za-z0-9+/=]+)/i))){                     // 舊格式（第一版）
    const bin = atob(m[1]); bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  } else throw new Error("格式不對，戰績碼應以 BIG2- 開頭");
  let data;
  try { data = JSON.parse(new TextDecoder().decode(bytes)); }
  catch(e){ throw new Error("戰績碼讀不出來，可能複製不完整或被改動過"); }
  if (!Array.isArray(data.p) || data.p.length!==4 || !Array.isArray(data.r)) throw new Error("戰績碼內容不完整");
  const rounds = data.r.map(a=>{
    if (!Array.isArray(a) || a.length!==5) throw new Error("局數資料有誤");
    const w = a[0], cards = a.slice(1).map(Number);
    if (![0,1,2,3].includes(w)) throw new Error("局數資料有誤");
    cards.forEach((n,k)=>{ if (k!==w && !(Number.isInteger(n) && n>=1)) throw new Error("局數資料有誤"); });
    cards[w] = 0; return { winner:w, cards };
  });
  return { players:data.p.map((s,k)=> String(s||"").slice(0,10) || `玩家 ${k+1}`), price: Number(data.$)>=0 ? Number(data.$) : 0, rounds, updatedAt: Number(data.t)||0 };
}

$("exportBtn").addEventListener("click", async ()=>{
  const code = encodeState(), box = $("exportBox");
  box.value = code; box.style.display = "block";
  try { await navigator.clipboard.writeText(code); toast(`已複製戰績碼（${state.rounds.length} 局）`); }
  catch(e){ box.focus(); box.select(); toast("請長按上方戰績碼手動複製"); }
});

let pendingImport = null;
$("importBox").addEventListener("input", ()=>{ pendingImport=null; $("importBtn").textContent="匯入"; $("importMsg").textContent=""; $("importMsg").classList.remove("ok"); });
$("importBtn").addEventListener("click", ()=>{
  const msg = $("importMsg");
  if (pendingImport){
    state = pendingImport; pendingImport = null; save(); resetDraft(); pendingConfirm=null;
    renderSettings(); renderAll();
    $("importBox").value=""; $("importBtn").textContent="匯入"; msg.textContent="";
    toast(`已匯入 ${state.rounds.length} 局，可以繼續記錄`); return;
  }
  try {
    const s = decodeState($("importBox").value);
    pendingImport = s;
    msg.classList.add("ok");
    msg.textContent = `讀到 ${s.rounds.length} 局：${s.players.join("、")}，每張 $${s.price}。匯入會取代這台目前的 ${state.rounds.length} 局紀錄。`;
    $("importBtn").textContent = "確認匯入";
  } catch(e){
    msg.classList.remove("ok");
    msg.textContent = e.message && /^[一-鿿]/.test(e.message) ? e.message : "無法讀取，請確認戰績碼完整複製";
  }
});

renderSettings(); renderAll();
// 自架版：資料存在這支手機的瀏覽器（localStorage），並請求瀏覽器長期保留
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
</script>
